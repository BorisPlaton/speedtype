apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zeus.release_name" . }}
  labels:
    {{- include "zeus.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "zeus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zeus.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "zeus.serviceAccount.name" . }}
      {{- with .Values.zeus.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "zeus.image.name" . }}
          imagePullPolicy: {{ .Values.zeus.image.pullPolicy }}
          ports:
            {{- toYaml .Values.service.ports | nindent 12 }}
          {{- with .Values.zeus.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.zeus.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.zeus.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.zeus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      env:
        - name: ZEUS_APP_NAME
          value: {{ .Chart.AppName | quote }}
        - name: ZEUS_LOG_LEVEL
          value: {{ .Values.zeus.env.zeus.logLevel | quote }}
        - name: ZEUS_PORT
          value: {{ .Values.zeus.env.zeus.port | quote }}
        - name: ZEUS_DEBUG
          value: {{ .Values.zeus.env.zeus.debug | quote }}
        - name: MONGO_HOST
          value: {{ include "zeus.env.mongodb.host" . }}
        - name: MONGO_PORT
          value: {{ .Values.zeus.env.mongodb.port | quote }}
        - name: MONGO_USERNAME
          value: {{ .Values.zeus.env.mongodb.username | quote }}
        - name: MONGO_DATABASE_NAME
          value: {{ .Values.zeus.env.mongodb.databaseName | quote }}
