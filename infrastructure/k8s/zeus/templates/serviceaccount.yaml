apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zeus.serviceAccount.name" . }}
  labels:
    {{- include "zeus.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.name }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
