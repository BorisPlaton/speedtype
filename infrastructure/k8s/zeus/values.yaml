environment: ""

zeus:
  labels:
    part_of: "speedtype"
    component: "backend"
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http
  image:
    repository: ""
    pullPolicy: IfNotPresent
    tag: ""
  podSecurityContext:
    fsGroup: 2000
  containerSecurityContext:
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

service:
  type: ClusterIP
  port: 80

serviceAccount:
  automount: false

ingress:
  className: ""
  annotations: { }
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]
  # - secretName: chart-example-tls
  #   hosts:
  #     - chart-example.local
