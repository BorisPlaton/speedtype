environment: ""

zeus:
  labels:
    part_of: "speedtype"
    component: "backend"
  ports:
    - name: http
      containerPort: 8000
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http
  image:
    repository: ""
    pullPolicy: IfNotPresent
    tag: ""
  podSecurityContext:
    fsGroup: 2000
  containerSecurityContext:
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    zeus:
      appName: zeus
      logLevel: INFO
      port: 8000
      debug: false
      workers: 1
    mongodb:
      port: 27017
      username: admin
      databaseName: zeus

service:
  type: ClusterIP
  port: 80

serviceAccount:
  automount: false

httpRoute:
  gateway:
    name: ""
    namespace: ""
