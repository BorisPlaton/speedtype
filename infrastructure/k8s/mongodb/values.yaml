environment: ""

gcp:
  projectId: ""

mongodb:
  members: 1
  storage_size: "5Gi"
  admin:
    username: "admin"
  labels:
    part_of: "speedtype"
    component: "database"

secrets:
  target: "mongodb-creds"
  storeName: "gcp-store"
  gcpNames:
    mongodbPassword: "MONGODB_PASSWORD_"
  k8sNames:
    mongodbPassword: "mongodb-password"
    scramCredentials: "mongodb-scram"
