apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.target }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.target }}
  data:
    - secretKey: {{ .Values.secrets.k8sNames.mongodbPassword }}
      remoteRef:
        key: {{ include "mongodb.secrets.password" . }}
