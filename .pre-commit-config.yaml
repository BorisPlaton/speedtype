default_install_hook_types: [ pre-commit, pre-push ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [ --fix ]
  - repo: local
    hooks:
      - id: zeus tests
        name: zeus tests
        entry: just --justfile zeus/justfile tests
        language: system
        pass_filenames: false
        always_run: true
        types: [ python ]
        stages: [ pre-push ]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --args=-write=true
      - id: terraform_tflint
        files: \.tf$
      - id: terraform_trivy
        files: \.tf$
      - id: terraform_validate
        files: \.tf$
