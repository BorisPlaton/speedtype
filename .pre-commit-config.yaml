default_install_hook_types: [ pre-commit, pre-push ]

repos:

  ##################
  ## Common hooks ##
  ##################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
        exclude: ^infrastructure/k8s/
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  ##################
  ## Python hooks ##
  ##################
  - repo: local
    hooks:
      - id: zeus format
        name: zeus format
        entry: just --justfile zeus/justfile format
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
        files: ^zeus/

  - repo: local
    hooks:
      - id: zeus tests
        name: zeus tests
        entry: just --justfile zeus/justfile tests
        language: system
        pass_filenames: false
        stages: [ pre-push ]
        files: ^zeus/

  #####################
  ## Terraform hooks ##
  #####################
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --args=-write=true
      - id: terraform_tflint
        files: \.tf$
      - id: terraform_trivy
        files: \.tf$
      - id: terraform_validate
        files: \.tf$

  ################
  ## Helm hooks ##
  ################
  - repo: local
    hooks:
      - id: lint mongodb helm
        name: lint helm
        entry: helm lint infrastructure/k8s/mongodb --set environment="dev" --set gcp.project_id="project-6dev2ff5-fake-1aa2-cl2"
        language: system
        pass_filenames: false
        stages: [ pre-push ]
        files: ^infrastructure/k8s/mongodb/
