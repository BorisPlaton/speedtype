default_install_hook_types: [ pre-commit, pre-push ]

repos:

  ##################
  ## Common hooks ##
  ##################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
        exclude: ^infrastructure/k8s/
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  ##################
  ## Python hooks ##
  ##################
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
        files: ^(zeus|speedtype)/
      - id: ruff-check
        args: [ --fix ]
        files: ^(zeus|speedtype)/

  - repo: local
    hooks:
      - id: zeus tests
        name: zeus tests
        entry: just --justfile zeus/justfile tests
        language: system
        pass_filenames: false
        stages: [ pre-push ]
        files: ^zeus/

  #####################
  ## Terraform hooks ##
  #####################
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --args=-write=true
      - id: terraform_tflint
        files: \.tf$
      - id: terraform_trivy
        files: \.tf$
      - id: terraform_validate
        files: \.tf$
