repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [ --fix ]
  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: cd zeus && just tests
        language: system
        pass_filenames: false
        always_run: false
        types: [ python ]
        stages: [ pre-push ]
