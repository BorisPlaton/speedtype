[project]
name = "zeus"
version = "0.1.0"
description = "."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dependency-injector[pydantic2]>=4.49.0",
    "fastapi>=0.136.3",
    "funcy>=2.0",
    "httptools>=0.8.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.17.0",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
    "uvloop>=0.22.1",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "ipython>=9.12.0",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "syrupy>=6.0.0",
    "testcontainers[mongodb]>=4.15.0",
]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
indent-width = 4
extend-exclude = [
    "__pycache__",
]
src = ["src"]

[tool.ruff.lint]
ignore = ["ANN002", "ANN003", "COM812", "N818", "TRY003"]
preview = true
select = [
    "ANN",
    "B",
    "A",
    "COM",
    "C4",
    "T20",
    "RET",
    "SLF",
    "SIM",
    "ARG",
    "I",
    "N",
    "E",
    "W",
    "F",
    "PGH003",
    "PGH004",
    "PLC",
    "PLE",
    "TRY",
]

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.black]
line-length = 120

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
addopts = "--cov=src --no-cov-on-fail -x"
testpaths = [
    "src/tests",
]
pythonpath = [
    "src",
]

[tool.coverage.run]
omit = [
    ".venv/*",
    "src/tests/*",
    "src/inbound/**/__main__.py",
]
disable_warnings = ["couldnt-parse"]

[tool.coverage.report]
skip_empty = true
skip_covered = true

[tool.coverage.html]
directory = "src/tests/coverage"
