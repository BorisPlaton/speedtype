name: Modify K8s cluster

on:
  workflow_call:
    inputs:
      environment:
        description: Environment for which cluster changes are applied
        type: string
        required: true

jobs:

  install:
    name: install charts
    runs-on: ubuntu-latest
    steps:
      - name: add remote repositories
        run: >-
          helm repo add external-secrets https://charts.external-secrets.io &&
          helm repo add mongodb https://mongodb.github.io/helm-charts &&
          helm repo update
      - name: install dependency charts
        run: |
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets --create-namespace \
            --version 2.12.0 \
            --rollback-on-failure \
            --wait --timeout 5m
          helm upgrade --install mongodb mongodb/mongodb-kubernetes \
            --namespace "mongodb-${{ inputs.environment }}" --create-namespace \
            --version 1.13.0 \
            --rollback-on-failure \
            --wait --timeout 5m
      - name: install mongodb
        run: todo
      - name: install zeus
        run: todo
