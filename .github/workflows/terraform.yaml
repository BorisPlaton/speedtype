name: Apply Terraform changes

on:
  workflow_call:
    inputs:
      environment:
        description: Environment for which Terraform changes are applied
        type: string
        required: true

jobs:

  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: './infrastructure/terraform/speedtype'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Authenticate into Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=tf-remote-state-${TF_VAR_project_id}" \
            -backend-config="prefix=envs/${TF_VAR_environment}"
      - name: Show changes
        run: terraform plan
      - name: Apply changes
        run: terraform apply -auto-approve
