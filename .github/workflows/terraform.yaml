name: Apply Terraform changes

on:
  workflow_call:
    inputs:
      environment:
        description: Environment for which Terraform changes are applied
        type: string
        required: true

jobs:

  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: './infrastructure/terraform'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Authenticate into Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GHA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SERVICE_ACCOUNT }}
      - name: Acquire GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_REMOTE_STATE_BUCKET }}" \
            -backend-config="prefix=envs/${TF_VAR_environment}"
      - name: Apply changes
        run: terraform apply -auto-approve
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
