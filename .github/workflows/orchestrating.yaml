name: Orchestrating pipeline

on:
  push:
    branches:
      - main
      - task/deploy-to-gcp
  pull_request:

jobs:

  # Checks what files have been changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      zeus: ${{ steps.filter.outputs.zeus }}
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            zeus: [
              'zeus/src/**',
              'zeus/Dockerfile',
              'zeus/pyproject.toml',
              'zeus/uv.lock',
            ]
            terraform: ['infrastructure/terraform/**']
            k8s: ['infrastructure/k8s/**']

  # Applies infrastructure changes on GCP.
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    secrets: inherit
    uses: './.github/workflows/terraform.yaml'
    permissions:
      contents: read
      id-token: write
    with:
      environment: 'dev'

  # Builds and pushes Zeus docker image to the artifact registry.
  build:
    needs: changes
    if: needs.changes.outputs.zeus == 'true'
    secrets: inherit
    uses: './.github/workflows/build.yaml'

