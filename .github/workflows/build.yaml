name: Build Docker image

on:
  workflow_call:

jobs:

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './zeus'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            zeus
          sparse-checkout-cone-mode: true
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
          python-version: 3.14
      - name: Install zeus dependencies
        run: just init
      - name: Run linters
        run: just lint
      - name: Run tests
        run: just tests

  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            zeus
          sparse-checkout-cone-mode: true
      - name: Authenticate into Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GHA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PUSH_IMAGE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Login into artifact registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Setup docker build
        uses: docker/setup-buildx-action@v3
      - name: Build & Push image to registry
        uses: docker/build-push-action@v6
        with:
          context: ./zeus
          push: ${{ github.ref == 'refs/pull/16/merge' }}
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_URI }}/zeus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
